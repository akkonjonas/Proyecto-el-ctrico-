<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1115">
<title>Electro JS - Administrador</title>
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="admin-icon-192.png">
<link rel="apple-touch-icon" href="admin-icon-192.png">
<meta name="apple-mobile-web-app-title" content="EJS Admin">
<script>try{var t=localStorage.getItem("ejs_admin_tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script>window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__bip=e;document.dispatchEvent(new Event("bipready"))})</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--txt:#e8eaf0;--mut:#8b93a5;--acc:#f5b301;--acc2:#ffd23f;--ok:#2fbf71;--bad:#ff5d5d;--blue:#3d8bfd;--r:16px;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f5f7;--card:#ffffff;--card2:#f0f2f5;--line:#dfe3e8;--txt:#16191d;--mut:#5f6874;--acc:#d99a00;--acc2:#f5b301;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Barlow,system-ui,sans-serif}
body{padding:0 14px calc(40px + env(safe-area-inset-bottom));max-width:680px;margin:auto}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;line-height:1.1}
button,a.b{font:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#0f1115;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;transition:opacity .45s}
#intro.out{opacity:0;pointer-events:none}
#intro>svg{width:110px;height:110px;overflow:visible}
#intro .ring{fill:#171a21;stroke:#f5b301;stroke-width:1.1;stroke-dasharray:64.1;stroke-dashoffset:64.1;animation:ring 1s ease-out forwards}
#intro .bolt{fill:#ffd23f;opacity:0;animation:boltIn .5s .6s ease forwards,zap 1.6s 1.2s infinite}
#intro .sh{opacity:0;animation:fadeUp .5s 1s ease forwards}
#intro h1{font-size:34px;opacity:0;animation:fadeUp .5s .8s ease forwards}#intro h1 span{color:#ffd23f}
#intro p{margin:0;color:#8b93a5;letter-spacing:.2em;text-transform:uppercase;font-size:12px;opacity:0;animation:fadeUp .5s 1s ease forwards}
@keyframes ring{to{stroke-dashoffset:0}}
@keyframes boltIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes zap{0%,62%,100%{opacity:1;filter:none}64%{filter:drop-shadow(0 0 6px #ffd23f)}66%{opacity:.4}68%{opacity:1;filter:drop-shadow(0 0 10px #ffd23f)}}

/* ---------- barra ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.logo{width:38px;height:38px;flex:none}
.logo circle{fill:var(--card);stroke:var(--acc);stroke-width:1.3}.logo path{fill:var(--acc2);animation:zap 2.6s infinite}
.brand{flex:1;min-width:0}.brand h1{font-size:22px}.brand h1 span{color:var(--acc)}.brand small{display:block;color:var(--mut);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);display:grid;place-items:center;font-size:17px}
.ib:active{transform:scale(.92)}

/* ---------- tarjetas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;animation:cardIn .4s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.sec h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
input{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;margin-bottom:9px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#1a1300;border:0;border-radius:12px;padding:11px 16px;font-weight:700;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.w{width:100%}
.btn.g{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.r{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 60%,transparent);font-weight:600}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.s{font-size:12.5px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ---------- resumen ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;animation:cardIn .4s ease both}
.st b{display:block;font-size:26px;font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;color:var(--acc)}
.st.ok b{color:var(--ok)}.st.mu b{color:var(--mut)}
.st small{font-size:12px;color:var(--mut)}

/* ---------- código nuevo ---------- */
.code{font:800 32px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;color:var(--acc);text-align:center;margin:12px 0 4px;animation:codeIn .6s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 40%,transparent)}
.code.sm{font-size:22px;margin:8px 0 2px;animation:none;text-shadow:none}
@keyframes codeIn{from{opacity:0;transform:scale(.6);letter-spacing:14px}}

/* ---------- filtros ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-size:12px;background:var(--card2);border-radius:999px;padding:1px 7px;color:var(--mut)}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--txt)}
.chip.on i{background:var(--acc);color:#1a1300}

/* ---------- licencias ---------- */
.lic{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--line)}
.lic.k-act{border-left-color:var(--ok)}.lic.k-unu{border-left-color:var(--acc)}.lic.k-exp{border-left-color:var(--bad)}
.lic .li{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--card2)}
.lic .lb{flex:1;min-width:0}
.lic h3{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin:3px 0}
.pill.act{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.unu{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.pill.exp{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.del{border:1px solid var(--line);background:var(--card2);color:var(--bad);width:36px;height:36px;border-radius:10px;flex:none;font-size:16px}
.del:active{transform:scale(.9)}
.gone{animation:zapOut .5s ease forwards!important}
@keyframes zapOut{0%{transform:none}25%{transform:translateX(-6px);box-shadow:0 0 0 2px var(--acc2),0 0 18px rgba(255,210,63,.6)}100%{opacity:0;transform:scale(.9) translateX(40px);max-height:0;margin:0;padding-top:0;padding-bottom:0}}
.purge{width:100%;margin-bottom:12px}
.note{border:1px dashed var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:14px;padding:12px;font-size:13.5px;margin-bottom:12px}
.note b{color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:18px 10px}
.empty span{display:block;font-size:30px;margin-bottom:4px}

/* ---------- alumnos ---------- */
.usr h3{font-size:18px}
.usr .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.usr .meta span{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.wait{color:var(--acc)}
.search{position:relative}.search input{padding-left:36px}.search::before{content:"🔎";position:absolute;left:12px;top:11px;font-size:14px;opacity:.7}

/* ---------- toast + pie ---------- */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#171a21;color:#fff;border:1px solid #f5b301;border-radius:14px;padding:11px 16px;font-size:14px;opacity:0;transition:.3s;z-index:90;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;margin:26px 0 6px}
.ecp{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;--cpc:var(--mut)}
.ecp svg{width:15px;height:15px;fill:#ffd23f;animation:zap 2.6s infinite}
.ecpt{background:linear-gradient(100deg,var(--cpc) 0 42%,#ffd23f 47%,#fffbe6 50%,#ffd23f 53%,var(--cpc) 58% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 2.6s linear infinite}
@keyframes sweep{from{background-position:110% 0}to{background-position:-160% 0}}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="intro">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" class="ring"/><path class="bolt" d="M13.4 4.6 7.9 13h3.8l-1.3 6.4 5.6-8.6h-3.8z"/></svg>
  <h1>Electro <span>JS</span></h1>
  <p>Administrador</p>
  <span class="ecp sh" style="margin-top:20px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span class="ecpt">© Desarrollado por Jonás Silva</span></span>
</div>

<div class="bar">
  <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.2"/><path d="M13.4 4.6 7.9 13h3.8l-1.3 6.4 5.6-8.6h-3.8z"/></svg>
  <div class="brand"><h1>Electro <span>JS</span></h1><small>Administrador</small></div>
  <button class="ib" id="bInst" title="Instalar" hidden>⬇</button>
  <button class="ib" id="bRef" title="Actualizar" hidden>↻</button>
  <button class="ib" id="bTheme" title="Tema">🌙</button>
</div>

<!-- ingreso -->
<div id="login">
  <div class="card" style="margin-top:14px">
    <h2 style="font-size:22px;margin-bottom:4px">Ingresar al panel</h2>
    <p class="s" style="margin:0 0 12px">Con tu clave de administrador de Supabase (ADMIN_KEY).</p>
    <input id="api" placeholder="Dirección de la función (https://xxxx.supabase.co/functions/v1/…)" autocomplete="off">
    <input id="key" type="password" placeholder="Clave de administrador" autocomplete="current-password">
    <button class="btn w" id="bIn">Entrar</button>
    <div class="err" id="e1"></div>
  </div>
</div>

<!-- panel -->
<div id="panel" hidden>
  <div class="stats">
    <div class="st"><b id="nU">0</b><small>Alumnos</small></div>
    <div class="st ok"><b id="nA">0</b><small>Licencias activas</small></div>
    <div class="st mu"><b id="nS">0</b><small>Sin usar</small></div>
  </div>

  <div class="sec"><h2>Nueva licencia</h2></div>
  <div class="card">
    <input id="lab" placeholder="¿Para quién es? (solo lo ves vos)" maxlength="60">
    <button class="btn w" id="bNew">⚡ Generar código</button>
    <div id="out"></div>
  </div>

  <div class="sec"><h2>Licencias</h2><span class="s" id="lsum"></span></div>
  <div id="note"></div>
  <div class="chips" id="chips"></div>
  <div id="purge"></div>
  <div id="codes"></div>

  <div class="sec"><h2>Alumnos</h2><span class="s" id="usum"></span></div>
  <div class="search"><input id="qU" placeholder="Buscar alumno" autocomplete="off"></div>
  <div id="users"></div>

  <div style="text-align:center;margin-top:18px"><button class="btn g sm" id="bOut">Cerrar panel</button></div>
</div>

<footer><span class="ecp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span class="ecpt">© Desarrollado por Jonás Silva</span></span></footer>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF_API = "https://dkwtfdzwlhzjvjeahxcp.supabase.co/functions/v1/clever-processor";
let API = localStorage.getItem("eq_admin_api") || DEF_API, KEY = sessionStorage.getItem("eq_admin_key") || "";
let DATA = {users:[], codes:[]}, CAN_DEL = false, FILT = "act", QU = "";
$("api").value = API;

/* ---------- utilidades visuales ---------- */
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),2600); }
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn"); if(!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), s = document.createElement("span");
  s.className = "rip"; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s); setTimeout(()=>s.remove(), 600);
});
function busy(b, on, txt){ if(on){ b._t=b.innerHTML; b.disabled=true; b.innerHTML=`<span class="spin"></span>${txt||""}`; } else { b.disabled=false; if(b._t) b.innerHTML=b._t; } }
function count(el, to){ const from=parseInt(el.textContent)||0, t0=performance.now(); const f=t=>{ const k=Math.min(1,(t-t0)/600); el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }

/* ---------- tema ---------- */
function setThemeIcon(){ const t=document.documentElement.getAttribute("data-theme")||"dark"; $("bTheme").textContent = t==="light" ? "🌙" : "☀️"; }
$("bTheme").onclick = () => { const t=(document.documentElement.getAttribute("data-theme")||"dark")==="light"?"dark":"light"; document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("ejs_admin_tema",t)}catch(e){} setThemeIcon(); };
setThemeIcon();

/* ---------- servidor ---------- */
const ADM = () => API.replace(/\/functions\/v1\/[^/?#]+\/?$/, "/functions/v1/electro-admin");
async function post(url, action, extra){
  const r = await fetch(url, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({action, key:KEY, ...extra})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(d.error || ("Error " + r.status)); e.status = r.status; throw e; }
  return d;
}
const call = (a, x) => post(API, a, x);

async function entrar(){
  API = $("api").value.trim() || DEF_API; KEY = $("key").value; $("e1").textContent = "";
  const b = $("bIn"); busy(b, true, " Entrando…");
  try{
    await call("admin_list");
    localStorage.setItem("eq_admin_api", API); sessionStorage.setItem("eq_admin_key", KEY);
    $("login").hidden = true; $("panel").hidden = false; $("bRef").hidden = false;
    await cargar();
  }catch(e){ $("e1").textContent = e.message==="Failed to fetch" ? "No se pudo conectar. Revisá la dirección y tu internet." : e.message; }
  busy(b, false);
}
$("bIn").onclick = entrar;
$("key").addEventListener("keydown", e => { if(e.key==="Enter") entrar(); });
$("bOut").onclick = () => { sessionStorage.removeItem("eq_admin_key"); location.reload(); };
$("bRef").onclick = async () => { const b=$("bRef"); b.style.transition="transform .6s"; b.style.transform="rotate(360deg)"; await cargar(); setTimeout(()=>{b.style.transition="";b.style.transform="";},650); toast("Lista actualizada"); };

async function cargar(){
  const r = await call("admin_list");
  DATA.users = r.users || [];
  try{ const c = await post(ADM(), "codes_list"); DATA.codes = c.codes || []; CAN_DEL = true; }
  catch(e){ DATA.codes = (r.codes || []).map((c,i)=>({...c, id:null})); CAN_DEL = false; DATA.admErr = e.status===403 ? "La función electro-admin rechazó la clave." : ""; }
  pintar();
}

/* ---------- licencias ---------- */
const kind = c => c.used_at ? "act" : (c.expires_at && new Date(c.expires_at) < new Date() ? "exp" : "unu");
const fd = d => d ? new Date(d).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const fdd = d => d ? new Date(d).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}) : "—";
function appUrl(){ return location.href.replace(/admin\.html.*$/, "").replace(/[?#].*$/, ""); }
function wa(code, name){
  const t = "Hola" + (name ? " " + name : "") + "! Tu código de activación para Electro JS es: " + code +
    "\n\nSe usa una sola vez. Entrá a " + appUrl() + ", tocá «Crear cuenta», escribí tu nombre y este código, y apoyá tu dedo en el sensor.";
  return "https://wa.me/?text=" + encodeURIComponent(t);
}
function codeBox(code, name, small){
  return `<div class="code ${small?"sm":""}">${esc(code)}</div><div class="act">
    <button class="btn g sm" onclick="copiar(this,'${esc(code)}')">📋 Copiar</button>
    <a class="btn sm" target="_blank" rel="noopener" href="${wa(code,name)}">💬 Enviar por WhatsApp</a></div>`;
}
function copiar(b, t){ navigator.clipboard.writeText(t).then(()=>{ b.innerHTML="✔ Copiado"; toast("Código copiado"); }).catch(()=>toast("No se pudo copiar")); }

function pintar(){
  const C = DATA.codes, n = {act:0, unu:0, exp:0}; C.forEach(c => n[kind(c)]++);
  count($("nU"), DATA.users.length); count($("nA"), n.act); count($("nS"), n.unu + n.exp);
  $("lsum").textContent = C.length + " en total";
  const F = [["act","✅ Activas",n.act],["unu","⏳ Sin usar",n.unu],["exp","⌛ Vencidas",n.exp],["all","Todas",C.length]];
  $("chips").innerHTML = F.map(([k,l,v]) => `<button class="chip ${FILT===k?"on":""}" onclick="filtro('${k}')">${l}<i>${v}</i></button>`).join("");
  $("note").innerHTML = CAN_DEL ? "" : `<div class="note">🧹 <b>Para poder borrar licencias</b> falta crear la función <b>electro-admin</b> en Supabase (te dejé las instrucciones). Mientras tanto ves la lista, pero no se puede borrar.${DATA.admErr?"<br>"+esc(DATA.admErr):""}</div>`;
  const nDel = n.unu + n.exp;
  $("purge").innerHTML = CAN_DEL && nDel ? `<button class="btn r purge" id="bPurge" onclick="purgar()">🧹 Borrar todas las que no están en uso (${nDel})</button>` : "";
  const list = C.filter(c => FILT==="all" || kind(c)===FILT);
  const ico = {act:"✅", unu:"⏳", exp:"⌛"};
  $("codes").innerHTML = list.map((c,i) => {
    const k = kind(c), lab = c.label || "(sin nombre)";
    const nm = String(c.label||"").replace(/^Reinicio de /,"");
    let info = k==="act" ? `Usada${c.used_by_name?" por <b>"+esc(c.used_by_name)+"</b>":""} · ${fd(c.used_at)}`
             : k==="unu" ? `Creada ${fdd(c.created_at)} · vence ${fdd(c.expires_at)}`
             : `Venció el ${fdd(c.expires_at)} sin usarse`;
    const pill = {act:"Activa", unu:"Sin usar", exp:"Vencida"}[k];
    const showCode = k==="unu" && c.code ? codeBox(c.code, nm, true) : (k==="unu" ? `<p class="s" style="margin:6px 0 0">El código no quedó guardado para mostrarlo. Si hace falta, borrala y generá una nueva.</p>` : "");
    return `<div class="card lic k-${k}" style="animation-delay:${Math.min(i,12)*30}ms" data-id="${esc(c.id||"")}">
      <div class="li">${ico[k]}</div>
      <div class="lb"><h3>${esc(lab)}</h3><span class="pill ${k}">${pill}</span><div class="s">${info}</div>${showCode}</div>
      ${k!=="act" && CAN_DEL && c.id ? `<button class="del" title="Borrar" onclick="borrarCod(this,'${esc(c.id)}','${esc(lab).replace(/'/g,"")}')">🗑</button>` : ""}
    </div>`;
  }).join("") || `<div class="empty"><span>${FILT==="act"?"🔌":"✨"}</span>${FILT==="act"?"Todavía no hay licencias activas.":"Lista limpia: no hay licencias en esta categoría."}</div>`;
  pintarUsuarios();
}
function filtro(k){ FILT = k; pintar(); }

async function borrarCod(b, id, lab){
  if(!confirm("¿Borrar la licencia de «"+lab+"»? El código deja de servir.")) return;
  const card = b.closest(".lic"); b.disabled = true;
  try{
    await post(ADM(), "codes_delete", {ids:[id]});
    card.classList.add("gone");
    setTimeout(()=>{ DATA.codes = DATA.codes.filter(c => c.id !== id); pintar(); }, 480);
    toast("Licencia borrada");
  }catch(e){ b.disabled = false; toast(e.message); }
}
async function purgar(){
  const ids = DATA.codes.filter(c => kind(c)!=="act" && c.id).map(c => c.id);
  if(!ids.length) return;
  if(!confirm("¿Borrar las "+ids.length+" licencias que no están en uso (sin usar y vencidas)? Las activas no se tocan.")) return;
  const b = $("bPurge"); busy(b, true, " Borrando…");
  try{
    const r = await post(ADM(), "codes_delete", {ids});
    document.querySelectorAll(".lic.k-unu,.lic.k-exp").forEach((el,i) => setTimeout(()=>el.classList.add("gone"), i*60));
    setTimeout(()=>{ DATA.codes = DATA.codes.filter(c => kind(c)==="act"); FILT = "act"; pintar(); }, 500 + Math.min(ids.length,12)*60);
    toast("🧹 " + r.deleted + " licencias borradas · lista limpia");
  }catch(e){ busy(b, false); toast(e.message); }
}

/* ---------- nueva licencia ---------- */
$("bNew").onclick = async () => {
  const b = $("bNew"), lab = $("lab").value.trim(); busy(b, true, " Generando…");
  try{
    const r = await call("admin_create_code", {label:lab});
    $("out").innerHTML = codeBox(r.code, lab) + `<p class="s" style="margin:8px 0 0">Queda en «Sin usar» hasta que el alumno cree su cuenta.</p>`;
    $("lab").value = ""; await cargar();
  }catch(e){ toast(e.message); }
  busy(b, false);
};

/* ---------- alumnos ---------- */
$("qU").addEventListener("input", e => { QU = e.target.value.toLowerCase(); pintarUsuarios(); });
function pintarUsuarios(){
  const U = DATA.users.filter(u => !QU || String(u.name).toLowerCase().includes(QU));
  $("usum").textContent = DATA.users.length + " en total";
  $("users").innerHTML = U.map((u,i) => {
    const nm = esc(u.name).replace(/'/g,"");
    return `<div class="card usr" style="animation-delay:${Math.min(i,12)*30}ms">
      <div class="row"><h3>${esc(u.name)}</h3><span class="s">${u.devices ? "📱 "+u.devices+" dispositivo"+(u.devices>1?"s":"") : "<span class='wait'>⏳ esperando código</span>"}</span></div>
      <div class="meta"><span>⚡ ${u.pts||0} pts</span><span>⭐ ${u.st||0}</span><span>✅ ${u.done||0} aprobados</span></div>
      <div class="s">Alta: ${fd(u.created_at)} · Último guardado: ${fd(u.updated_at)}</div>
      <div class="act"><button class="btn g sm" onclick="reiniciar('${u.id}','${nm}')">🔄 Cambio de teléfono</button><button class="btn r sm" onclick="borrarU(this,'${u.id}','${nm}')">Eliminar</button></div>
    </div>`;
  }).join("") || `<div class="empty"><span>👷</span>${QU?"Sin resultados.":"Todavía no hay alumnos."}</div>`;
}
async function reiniciar(id, name){
  if(!confirm("¿Reiniciar la cuenta de "+name+"? Su teléfono actual deja de entrar y se genera un código nuevo. Conserva su progreso.")) return;
  try{ const r = await call("admin_reset", {user_id:id}); $("out").innerHTML = codeBox(r.code, name) + `<p class="s" style="margin:8px 0 0">Código de reinicio para ${esc(name)}.</p>`; scrollTo({top:0,behavior:"smooth"}); await cargar(); }
  catch(e){ toast(e.message); }
}
async function borrarU(b, id, name){
  if(!confirm("¿Eliminar a "+name+" y todo su progreso? No se puede deshacer.")) return;
  try{ await call("admin_delete_user", {user_id:id}); b.closest(".card").classList.add("gone"); setTimeout(cargar, 480); toast(name+" eliminado"); }
  catch(e){ toast(e.message); }
}

/* ---------- instalación (PWA) ---------- */
if("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(()=>{});
function showInst(){ if(window.__bip) $("bInst").hidden = false; }
document.addEventListener("bipready", showInst); showInst();
$("bInst").onclick = async () => { const e = window.__bip; if(!e) return; e.prompt(); const r = await e.userChoice.catch(()=>null); if(r && r.outcome==="accepted"){ $("bInst").hidden = true; toast("¡Instalada!"); } window.__bip = null; };

/* ---------- inicio ---------- */
setTimeout(()=>{ $("intro").classList.add("out"); setTimeout(()=>$("intro").hidden=true, 500); }, 2000);
if(API && KEY){ $("key").value = KEY; entrar(); }
</script>
</body>
