<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Electro Quiz</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--txt:#eef0f4;--mut:#8b93a3;
  --acc:#f5b301;--acc2:#ffd25a;--ok:#2ecc71;--bad:#ff5d5d;--r:16px;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f5f6f8;--card:#ffffff;--card2:#f0f1f4;--line:#e0e3ea;--txt:#16181d;--mut:#6a7282;--acc:#e09f00;--acc2:#b87f00}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:84px}
#app{max-width:560px;margin:0 auto;padding:18px 16px}
h1,h2,h3,h4,p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:800;letter-spacing:.3px;font-size:20px}
.brand span{color:var(--acc)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--mut);font:inherit;font-size:13px}
.chip b{color:var(--txt)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hello{margin-bottom:16px}
.hello h2{font-size:22px}
.hello p{color:var(--mut);font-size:14px;margin-top:4px}
.hello p b{color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--acc)}
.stat small{color:var(--mut);font-size:12px}
.sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:14px 2px 10px}
.lv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.lv:active{transform:scale(.99)}
.lv.lock{opacity:.45;cursor:not-allowed}
.lv.hl{border-color:var(--acc)}
.ico{width:46px;height:46px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.lv .t{flex:1;min-width:0}
.lv h3{font-size:16px}
.lv p{font-size:13px;color:var(--mut);margin-top:3px}
.stars{font-size:15px;letter-spacing:2px;color:var(--acc);white-space:nowrap}
.stars i{color:var(--line);font-style:normal}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--acc);color:#1a1300}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn+.btn{margin-top:10px}
input.in{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:17px;margin:14px 0;outline:none}
input.in:focus{border-color:var(--acc)}
.login{padding-top:8vh;text-align:center}
.login .bolt{font-size:54px}
.login h1{font-size:30px;margin:8px 0 6px}
.login p{color:var(--mut);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.bar>div{height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;gap:10px}
.q{font-size:20px;font-weight:700;line-height:1.35;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:14px 15px;margin-bottom:10px;font:inherit;font-size:16px;line-height:1.35;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:rgba(46,204,113,.12)}
.opt.bad{border-color:var(--bad);background:rgba(255,93,93,.12)}
.opt.dim{opacity:.55}
.fb{border-radius:14px;padding:15px;margin:6px 0 14px;font-size:15px;line-height:1.5;border:1px solid var(--line);background:var(--card)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb h4{margin:0 0 8px;font-size:16px}
.fb .lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:10px 0 3px}
.res{text-align:center;padding-top:4vh}
.res .big{font-size:64px;margin:6px 0}
.res h2{font-size:26px}
.res .pts{font-size:42px;font-weight:800;color:var(--acc);margin:8px 0}
.res p{color:var(--mut)}
.newb{margin:18px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.badge{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;font-size:14px}
table{width:100%;border-collapse:collapse}
td,th{padding:12px 8px;text-align:left;font-size:15px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
td.n,th.n{text-align:right}
td small{display:block;color:var(--mut);font-size:12px}
tr.me td{color:var(--acc);font-weight:700}
.pos{width:34px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.bd .e{font-size:30px}
.bd h4{margin:6px 0 3px;font-size:14px}
.bd p{font-size:12px;color:var(--mut)}
.bd.off{opacity:.4;filter:grayscale(1)}
.bd.on{border-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:6px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.5}
.link{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.err{padding:30px 10px;text-align:center;color:var(--bad)}
nav button{font-size:10px}
nav button span{font-size:18px}
.arr{color:var(--mut);font-size:22px;flex:none}
.tag{display:inline-block;font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;white-space:nowrap}
.stat{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line)}
.mh{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.mh .ico{width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:24px;flex:none}
.mh h2{font-size:17px;line-height:1.25}.mh p{font-size:13px;color:var(--mut)}
.steps{padding-left:22px;margin:0 0 14px;font-size:14px;line-height:1.55}
.steps li{margin-bottom:8px}
.selfq,.keys,.chk{list-style:none;padding:0;margin:0 0 14px}
.selfq li,.keys li,.chk li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.5}
.selfq li:before{content:"❓ "}
.nlist li:before{content:"• "}
.keys li:before{content:"⭐ "}
.chk li:before{content:"☐ "}
.err2 li:before{content:"⚠️ "}
.rs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.rs h3{font-size:15px;color:var(--acc);margin-bottom:8px}
.rs ul,.rs-l{list-style:none;padding:0;margin:0}
.rs li,.rs-l li{font-size:14px;line-height:1.55;padding:7px 0;border-top:1px solid var(--line)}
.rs li:first-child,.rs-l li:first-child{border-top:0}
li.k{border-left:3px solid var(--line);padding-left:10px!important}
li.k .kt{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--card2)}
li.k.f{border-left-color:#7aa2ff}li.k.f .kt{color:#7aa2ff}
li.k.v{border-left-color:var(--ok)}li.k.v .kt{color:var(--ok)}
li.k.r{border-left-color:var(--acc)}li.k.r .kt{color:var(--acc)}
li.k.o{border-left-color:var(--bad);background:rgba(255,93,93,.07)}li.k.o .kt{color:var(--bad)}
li.k.n{border-left-color:#c58bff}li.k.n .kt{color:#c58bff}
.fm{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.5}
.fm h4{font-size:14px}.fm .eq{font-size:16px;font-weight:700;color:var(--acc);margin:4px 0;word-break:break-word}
.fm .ex{color:var(--mut);margin-top:4px}
.tw{margin-bottom:14px}.tw h4{font-size:13px;margin-bottom:6px}
.scr{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.dt{border-collapse:collapse;font-size:12.5px;width:100%}
.dt th,.dt td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.dt th{background:var(--card2);color:var(--acc);white-space:nowrap}
.pstep{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.pstep summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 14px;font-weight:600;font-size:14.5px;line-height:1.3}
.pstep summary::-webkit-details-marker{display:none}
.pn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#1a1300;display:grid;place-items:center;font-size:13px;font-weight:800}
.pstep[open] summary{border-bottom:1px solid var(--line)}
.pb{padding:12px 14px;font-size:14px;line-height:1.55}
.pb h5{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:12px 0 6px}
.pb p{margin-bottom:6px}
.resu{background:rgba(46,204,113,.10);border:1px solid var(--ok);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13.5px}
.refs{margin-top:8px}.rc{background:var(--card2);color:var(--mut);border:1px solid var(--line);border-radius:999px;font:inherit;font-size:12px;padding:4px 10px;margin:4px 6px 0 0;cursor:pointer}
.nrm{margin-bottom:12px}

.pdfbar{display:flex;gap:10px;align-items:center;margin:0 0 10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.pdfbar button,.pdfbar a{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;padding:6px 14px;text-decoration:none;cursor:pointer}
.pdfbar span{min-width:46px;text-align:center;color:var(--mut)}
.pdfbar a{margin-left:auto;font-size:13px}
.pdfv{overflow-x:auto;border-radius:10px}
.pdfv img{display:block;max-width:none;margin:0 0 10px;background:#fff;border-radius:6px}
.msg{margin:0 0 12px}
.msg.a{display:flex;gap:8px;align-items:flex-start}
.msg.u{display:block;margin-left:auto;max-width:85%;width:fit-content;background:var(--acc);color:#1a1300;border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:15px;line-height:1.4;font-weight:500}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 13px;font-size:14px;line-height:1.55;min-width:0;max-width:calc(100% - 40px)}
.bub p{margin:0 0 8px}.bub .steps{margin-bottom:8px}.bub .fm{background:var(--card2)}.bub .tw{margin:8px 0}
.bub .rs-l li{padding:6px 0}
.bub .mono{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--mut)}
.src{color:var(--mut);font-size:11px;margin-left:6px}
.calc{background:rgba(245,179,1,.08);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.calc h4{font-size:14px;margin-bottom:6px}
#chat{padding-bottom:88px}
.chatin{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:560px;margin:0 auto;padding:8px 12px;background:var(--bg);border-top:1px solid var(--line)}
.chatin input.in{margin:0;padding:12px 14px;font-size:16px;flex:1}
.chatin .btn{width:54px;margin:0;padding:0;font-size:20px}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin:0 2px;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
#credit{text-align:center;font-size:12px;color:var(--mut);padding:4px 16px 96px;opacity:.85}

.stat.pts{position:relative;overflow:visible}
.stat.pts.zap{animation:ptsZap .9s ease-out}
.stat.pts.zap b{animation:ptsGlow .9s ease-out;text-shadow:0 0 10px #ffd23f,0 0 22px #f5b301}
@keyframes ptsZap{0%{transform:scale(1)}15%{transform:scale(.9)}35%{transform:scale(1.08);box-shadow:0 0 0 2px #f5b301,0 0 26px rgba(245,179,1,.65)}60%{transform:scale(.98)}100%{transform:scale(1);box-shadow:none}}
@keyframes ptsGlow{0%,100%{color:var(--acc)}30%{color:#fffbe6}}
.stat.pts .spark{position:absolute;left:50%;top:40%;width:3px;height:12px;margin:-6px 0 0 -1.5px;border-radius:2px;background:#ffd23f;box-shadow:0 0 6px #f5b301;transform:rotate(var(--a)) translateY(0);opacity:0;animation:spark .7s ease-out forwards;pointer-events:none}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(-6px) scaleY(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-46px) scaleY(.3)}}
.cont .t p{margin-bottom:0}.cbar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.rdmark{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--acc);color:#111;font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;z-index:99;animation:rdm 2.2s ease forwards;pointer-events:none}@keyframes rdm{0%{opacity:0;transform:translate(-50%,-12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#171a21;color:#fff;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.stat.pts.zap,.stat.pts.zap b,.stat.pts .spark{animation:none}}

.ctag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-bottom:5px;background:rgba(245,179,1,.15);color:var(--acc)}
.lv.cont.k-mod{border-color:#3d8bfd}.k-mod .ctag{background:rgba(61,139,253,.15);color:#3d8bfd}.k-mod .cbar i{background:#3d8bfd}.k-mod .arr{color:#3d8bfd}.k-lv .arr{color:var(--acc)}
.ecp{display:inline-flex;align-items:center;gap:7px;font-weight:600;--cpc:var(--mut)}
.ecp svg{width:15px;height:15px;fill:#ffd23f;flex:none;animation:zap 2.6s infinite}
.ecpt{background:linear-gradient(100deg,var(--cpc) 0 42%,#ffd23f 47%,#fffbe6 50%,#ffd23f 53%,var(--cpc) 58% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 2.6s linear infinite}
@keyframes sweep{from{background-position:110% 0}to{background-position:-160% 0}}
@keyframes zap{0%,62%,100%{opacity:.55;filter:none;transform:none}64%{opacity:1;filter:drop-shadow(0 0 5px #ffd23f);transform:scale(1.15)}66%{opacity:.35}68%{opacity:1;filter:drop-shadow(0 0 8px #ffd23f);transform:scale(1.1)}72%{opacity:.7;transform:none}}
.celeb{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(8,10,14,.9);animation:cfade .3s ease;cursor:pointer;overflow:hidden}
.celeb.out{opacity:0;transition:opacity .3s}
.cbox{position:relative;text-align:center;color:#fff;padding:24px;max-width:340px}
.cbolt{width:92px;height:92px;fill:#ffd23f;animation:cbolt 1.1s ease-out both}
.ctit{margin:6px 0 16px;font-weight:800;font-size:28px;line-height:1.2;background:linear-gradient(100deg,#ffd23f 0 40%,#fffbe6 50%,#ffd23f 60% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 1.6s linear infinite,cpop .5s .15s cubic-bezier(.2,1.6,.4,1) both}
.cbs{display:flex;flex-direction:column;gap:10px;align-items:center}
.cb{display:flex;align-items:center;gap:10px;background:#171a21;border:1px solid #f5b301;border-radius:14px;padding:10px 16px;font-size:16px;box-shadow:0 0 18px rgba(245,179,1,.35);animation:cpop .55s cubic-bezier(.2,1.6,.4,1) both}
.cb .ce{font-size:30px}
.cbox small{display:block;margin-top:16px;color:#8a93a3;font-size:12px}
.cs{position:absolute;left:50%;top:50%;width:4px;height:18px;margin:-9px 0 0 -2px;border-radius:2px;background:#ffd23f;box-shadow:0 0 8px #f5b301;opacity:0;transform:rotate(var(--a));animation:cspark .9s var(--d) ease-out both;pointer-events:none}
@keyframes cspark{0%{opacity:1;transform:rotate(var(--a)) translateY(-30px) scaleY(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-170px) scaleY(.3)}}
@keyframes cbolt{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.25);opacity:1;filter:drop-shadow(0 0 22px #ffd23f)}35%{opacity:.3}45%{opacity:1;filter:drop-shadow(0 0 30px #ffd23f)}60%{transform:scale(.95)}100%{transform:scale(1);filter:drop-shadow(0 0 10px #f5b301)}}
@keyframes cpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes cfade{from{opacity:0}}
.newb .badge{animation:bglow 2.6s infinite}
@keyframes bglow{0%,60%,100%{box-shadow:none}64%,70%{box-shadow:0 0 14px rgba(245,179,1,.55)}}
@media(prefers-reduced-motion:reduce){.ecp svg,.ecpt,.cbolt,.ctit,.cb,.cs,.newb .badge{animation:none}.ecpt{color:var(--cpc);background:none}.ctit{color:#ffd23f;background:none}}

.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.qback{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--acc);color:var(--txt);border-radius:999px;padding:8px 14px 8px 10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.qback span{font-size:20px;line-height:1;color:var(--acc);margin-top:-2px}
.qback:active,.qrst:active{transform:scale(.96)}
.qrst{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.qsave{text-align:center;color:var(--mut);font-size:12px;margin-top:14px}

.bd{position:relative;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.bd.off{opacity:1;filter:none}.bd.off .e{filter:grayscale(1);opacity:.55}.bd.off h4{color:var(--mut)}
.bd.on{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc),0 0 14px color-mix(in srgb,var(--tc) 22%,transparent);overflow:hidden}
.bd.on::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:250% 100%;animation:bshine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes bshine{0%,55%{background-position:120% 0}100%{background-position:-120% 0}}

const unb64u = s => { s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const b=atob(s), o=new Uint8Array(b.length); for(let i=0;i<b.length;i++) o[i]=b.charCodeAt(i); return o.buffer; };

/* --- unir el progreso del teléfono con el del servidor (nunca se pierde nada) --- */
function mergeProgress(a, b){
  a = fix(a || newPlayer()); b = fix(b || newPlayer());
  const newer = (a.ts||0) >= (b.ts||0) ? a : b;
  const out = newPlayer();
  const keys = new Set([...Object.keys(a.levels), ...Object.keys(b.levels)]);
  keys.forEach(k => {
    const x = a.levels[k] || {score:0,pct:0,stars:0}, y = b.levels[k] || {score:0,pct:0,stars:0};
    out.levels[k] = {score:Math.max(x.score,y.score), pct:Math.max(x.pct,y.pct), stars:Math.max(x.stars,y.stars)};
  });
  out.badges = [...new Set([...a.badges, ...b.badges])];
  out.bestStreak = Math.max(a.bestStreak, b.bestStreak);
  out.fixed = Math.max(a.fixed, b.fixed);
  out.wrong = newer.wrong.slice();
  out.studied = Object.assign({}, a.studied, b.studied, newer.studied);
  out.days = [...new Set([...a.days, ...b.days])];
  out.seenB = [...new Set([...a.seenB, ...b.seenB])];
  out.ts = Math.max(a.ts||0, b.ts||0);
  return out;
}

function mk(a, lv){
  return {q:a[0], c:a[5], x:a[6], lv, opts: shuffle([a[1],a[2],a[3],a[4]].map((t,i)=>({t, ok:i===0})))};
}
function startSession(mode, id, lim){
  if(mode==="lv"||mode==="mod"){
    const r = rGet()[mode];
    if(r && String(r.id)===String(id) && !!r.quick===!!lim && r.qs && r.qs.length){ S = r; if(S.i>=S.qs.length) return finish(); return screenQuestion(); }
  }
  let qs = [];
  if (mode==="lv") qs = shuffle(Q[id]).map(a=>mk(a,id));
  else if (mode==="final") qs = shuffle(POOL).slice(0,FINAL_Q).map(x=>mk(x.a,x.lv));
  else if (mode==="mod") qs = shuffle(MODQ[id]||[]).slice(0, lim||999).map(a=>mk(a,id));
  else { const w = me().wrong; qs = shuffle(POOL.filter(x=>w.includes(x.a[0]))).slice(0,REV_Q).map(x=>mk(x.a,x.lv)); }
  if(!qs.length){ screenHome(); return; }
  S = {mode, id: mode==="final" ? "F" : id, qs, i:0, score:0, ok:0, streak:0, maxStreak:0, done:false, quick:!!lim};
  rSave(); screenQuestion();
}

function answer(i){
  if(S.done) return;
  S.done = true;
  const p = me(), q = S.qs[S.i], good = q.opts[i].ok;
  const btns = document.querySelectorAll(".opt");
  q.opts.forEach((o,k)=>{
    if(o.ok) btns[k].classList.add("ok");
    else if(k===i) btns[k].classList.add("bad");
    else btns[k].classList.add("dim");
  });
  let gain = 0;
  if(good){
    S.ok++; S.streak++; S.maxStreak = Math.max(S.maxStreak, S.streak);
    if(S.mode!=="rev"){ gain = 10 + (S.streak>=3 ? 5 : 0); if(q.cutIdx) gain = Math.ceil(gain/2); S.score += gain; }
    else p.fixed++;
    p.wrong = p.wrong.filter(t => t !== q.q);
  } else {
    S.streak = 0;
    if(!p.wrong.includes(q.q)) p.wrong.push(q.q);
  }
  save(); rSave();
  const right = q.opts.find(o=>o.ok).t;
  const last = S.i === S.qs.length-1;
  const nextBtn = `<button class="btn" onclick="next()">${last?"Ver resultado":"Siguiente"}</button>`;
  $("#fb").innerHTML = good ? `
    <div class="fb ok"><h4>✅ ¡Correcto!${gain?` +${gain} pts`:""}</h4>
    <span class="lbl">Concepto</span>${esc(q.c)}
    <span class="lbl">Para ampliar</span>${esc(q.x)}</div>${nextBtn}` : `
    <div class="fb bad"><h4>❌ Incorrecto</h4>
    <span class="lbl">Respuesta correcta</span><b>${esc(right)}</b>
    <span class="lbl">Concepto correcto</span>${esc(q.c)}</div>${nextBtn}`;
  $("#fb").scrollIntoView({behavior:"smooth", block:"nearest"});
}

function finish(){
  if(S.mode==="lv"||S.mode==="mod") rClear(S.mode);
  const p = me(), n = S.qs.length;
  const pct = Math.round(S.ok/n*100);
  p.bestStreak = Math.max(p.bestStreak, S.maxStreak);

  if(S.mode==="rev"){
    const got = awardBadges(p); save();
    const left = p.wrong.filter(t => POOL.some(x=>x.a[0]===t)).length;
    app.innerHTML = `
    <div class="res">
      <div class="big">🛠️</div>
      <h2>Repaso terminado</h2>
      <p>${S.ok} de ${n} corregidas${left?` · te quedan ${left} por reforzar`:" · ¡no te quedan errores pendientes!"}</p>
      ${badgesBox(got)}
      <div style="margin-top:18px">
        ${left?`<button class="btn" onclick="startSession('rev',0)">Seguir repasando</button>`:""}
        <button class="btn ${left?"ghost":""}" onclick="screenHome()">Volver al inicio</button>
      </div>
    </div>`;
    S = null; window.scrollTo(0,0); return;
  }

  const stars = pct===100 ? 3 : pct>=85 ? 2 : pct>=PASS ? 1 : 0;
  const key = S.id, prev = p.levels[key], passed = pct>=PASS;
  p.levels[key] = {score:Math.max(S.score, prev?prev.score:0), pct:Math.max(pct, prev?prev.pct:0), stars:Math.max(stars, prev?prev.stars:0)};
  const got = awardBadges(p); save();
  const wl = p.wrong.length;
  const wbtn = wl ? `<button class="btn ghost" onclick="startSession('rev',0)">Repasar errores (${wl})</button>` : "";
  const head = (ok, tit) => `<div class="big">${ok?"🎉":"💪"}</div><h2>${tit}</h2>`;
  const foot = `<p>${S.ok} de ${n} correctas · ${pct}%</p><div class="pts">+${S.score}</div>
    <div class="stars" style="font-size:30px">${starsHTML(stars)}</div>
    <p style="margin-top:10px">${passed?"Seguí así.":`Necesitás ${PASS}% para aprobar. Repasá los conceptos y probá de nuevo.`}</p>${badgesBox(got)}`;
  let html;
  if(S.mode==="mod"){
    const m = MOD_ITEMS.find(x=>x.id===key), idx = MOD_ITEMS.indexOf(m), nxt = MOD_ITEMS[idx+1];
    html = `${head(passed,passed?"¡Módulo aprobado!":"Casi lo lográs")}<p>${m.icon} Módulo ${m.n} · ${esc(m.name)}</p>${foot}

        <button class="btn" onclick="startSession('mod','${key}'${S.quick?","+QUICK_Q:""})">Jugar de nuevo</button>
        ${!passed&&STUDYD[key]?`<button class="btn ghost" onclick="screenModule('${key}','resumen')">Releer el resumen</button>`:""}
        ${nxt?`<button class="btn ghost" onclick="screenModule('${nxt.id}','guia')">Siguiente módulo</button>`:""}
        ${wbtn}<button class="btn ghost" onclick="screenMods()">Elegir otro módulo</button></div>`;
  } else if(S.mode==="final"){
    html = `${head(passed,passed?"¡Examen final aprobado!":"Casi lo lográs")}${foot}
      <div style="margin-top:18px"><button class="btn" onclick="startSession('final',0)">Repetir examen</button>${wbtn}
      <button class="btn ghost" onclick="screenHome()">Volver al inicio</button></div>`;
  } else {
    const idx = LEVELS.findIndex(l=>l.id===key), nxt = LEVELS[idx+1];
    html = `${head(passed,passed?"¡Nivel aprobado!":"Casi lo lográs")}<p>Nivel ${idx+1} · ${esc(LV(key).name)}</p>${foot}
      <div style="margin-top:18px">
        ${passed&&nxt?`<button class="btn" onclick="startSession('lv',${nxt.id})">Siguiente nivel</button>`:""}

function buildKB(){
  const docs = [];
  const modName = id => { const m = MOD_ITEMS.find(x=>x.id===id); return m ? m.name : id; };
  const add = d => { d.tk = toks(d.title+" "+d.title+" "+d.text); d.norm = norm(d.title+" "+d.text); docs.push(d); };
  Object.keys(STUDYD).forEach(id => {
    const st = STUDYD[id], mn = modName(id);
    st.resumen.forEach(sec => sec.items.forEach(it => add({type:"item", mod:id, title:mn+" "+sec.t, sec:sec.t, text:it})));
    (st.formulas||[]).forEach(f => add({type:"form", mod:id, title:mn+" "+f.n, text:[f.n,f.f,f.u,f.e].join(" "), f}));
    (st.tablas||[]).forEach(t => add({type:"tabla", mod:id, title:mn+" "+t.t, text:t.cols.join(" ")+" "+t.rows.map(r=>r.join(" ")).join(" "), t}));
    (st.claves||[]).forEach(c => add({type:"item", mod:id, title:mn+" para memorizar", sec:"Para memorizar", text:c}));
  });
  [["mono1","Proyecto 1"],["mono2","Proyecto 2"],["tri","Proyecto trifásico"]].forEach(([k,lab]) => {
    const P = PD[k]; if(!P) return;
    (P.tablas||[]).forEach(t => add({type:"tabla", proj:k, plabel:lab, title:lab+" "+t.t, text:t.cols.join(" ")+" "+t.rows.map(r=>r.join(" ")).join(" "), t}));
    (P.pasos||[]).forEach(s => {
      const body = [s.que].concat(s.como||[], s.norma||[], s.calculo||[], [s.resultado||""]).join(" ");
      add({type:"paso", proj:k, plabel:lab, n:s.n, title:lab+" paso "+s.n+" "+s.t, text:body, s});
    });
  });
  if(ND && ND.tabla_resumen){ const tr = ND.tabla_resumen; add({type:"tabla", src:"normas", title:"Normas AEA IRAM ERSeP resumen rápido que debe conocer un Categoría III", text:tr.cols.join(" ")+" "+tr.rows.map(r=>r.join(" ")).join(" "), t:{t:"Normas: resumen rápido", cols:tr.cols, rows:tr.rows}}); }
  if(ND){ const c3 = ND.cat3||{}; [["puede","Un Categoría III puede"],["no_puede","Un Categoría III NO puede"],["obligaciones","Obligaciones del Categoría III"]].forEach(([k,lab]) => (c3[k]||[]).forEach(t => add({type:"cat", title:lab+" categoria 3 instalador habilitado", sec:lab, text:t})));
    (ND.checklist||[]).forEach(t => add({type:"cat", title:"Lista de control del instalador normas", sec:"Lista de control", text:t})); }
  if(ND) ND.grupos.forEach(g => g.items.forEach(it => add({type:"norma", title:it.n+" "+it.t, text:it.q+" "+it.c, it})));
  const N = docs.length, df = {}; let tot = 0;
  docs.forEach(d => { tot += d.tk.length; new Set(d.tk).forEach(w => df[w] = (df[w]||0)+1); });
  KB = {docs, df, N, avg: tot/N};
}
function search(q, only){
  if(!KB) buildKB();
  const qt = qtoks(q), nq = norm(q), base = qt.filter(w=>!w.endsWith("~"));
  const words = norm(q).split(" ").filter(w=>w && !STOP.has(w));
  const k1 = 1.4, b = .75, res = [];
  KB.docs.forEach(d => {
    if(only && !only(d)) return;
    const tf = {}; d.tk.forEach(w => tf[w] = (tf[w]||0)+1);
    let sc = 0, hit = 0; const seen = new Set();
    qt.forEach(w => {
      const wt = w.endsWith("~") ? .45 : 1, t = w.replace("~","");
      const f = tf[t]; if(!f) return;
      const idf = Math.log(1 + (KB.N - (KB.df[t]||0) + .5)/((KB.df[t]||0) + .5));
      sc += wt * idf * (f*(k1+1))/(f + k1*(1 - b + b*d.tk.length/KB.avg));
      if(!w.endsWith("~") && !seen.has(t)){ seen.add(t); hit++; }
    });
    for(let i=0;i<words.length-1;i++) if(d.norm.includes(words[i]+" "+words[i+1])) sc += 1.2;
    if(sc > 0) res.push({d, sc, hit});
  });
  res.sort((a,b) => b.sc - a.sc);
  return {res, nbase: new Set(base).size};
}

/* ---- calculadoras con las fórmulas del curso ---- */
const num = s => parseFloat(String(s).replace(",","."));
const fmt = (x,d=2) => (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toString().replace(".",",");
function tryCalc(q){
  const t = q.toLowerCase();
  const tri = /trif/.test(t);
  if(/ca[ií]da/.test(t)){
    const L = /(\d+(?:[.,]\d+)?)\s*(?:metros?|mts?|m)(?![a-z0-9²])/i.exec(q), I = /(\d+(?:[.,]\d+)?)\s*(?:amperes?|amp|a)(?![a-z])/i.exec(q), S = /(\d+(?:[.,]\d+)?)\s*(?:mm2|mm²|mm)/i.exec(q);
    if(L && I && S){
      const l = num(L[1]), i = num(I[1]), s = num(S[1]), rho = .017, V = tri ? 380 : 220;
      const ct = (tri ? 1.73 : 2) * l * i * rho / s, pc = ct*100/V;
      return {title:`Caída de tensión ${tri?"trifásica":"monofásica"}`, steps:[
        `Fórmula del curso: Ct = (${tri?"1,73":"2"} × L × I × ρ) / S, con ρ del cobre = 0,017.`,
        `Ct = (${tri?"1,73":"2"} × ${fmt(l)} × ${fmt(i)} × 0,017) / ${fmt(s)} = ${fmt(ct)} V`,
        `Porcentaje: ${fmt(ct)} × 100 / ${V} = ${fmt(pc)} %`,
        pc<=3 ? `✔ ${fmt(pc)} % es menor al 3 %: cumple para iluminación y también para motores (5 %).` : pc<=5 ? `⚠ ${fmt(pc)} % supera el 3 % (iluminación) pero está dentro del 5 % de motores.` : `✘ ${fmt(pc)} % supera el 5 %: hay que aumentar la sección del cable o acortar el recorrido.`]};
    }
  }
  const P = /(\d+(?:[.,]\d+)?)\s*(kva|kw|va|w)\b/i.exec(q);
  if(P && /corriente|amper|intensidad|calcul|cuanto|i\s*\(?b/.test(t) && !/ca[ií]da/.test(t)){
    let s = num(P[1]); const u = P[2].toLowerCase(); if(u[0]==="k") s *= 1000;
    const Vm = /(\d+(?:[.,]\d+)?)\s*v(?:olts?)?\b/i.exec(q.replace(P[0],"")); const V = Vm ? num(Vm[1]) : (tri ? 380 : 220);
    const I = tri ? s/(V*1.73) : s/V;
    return {title:`Corriente de trabajo I(B) ${tri?"trifásica":"monofásica"}`, steps:[
      `Fórmula del curso: I(B) = ${tri?"S / (V × 1,73)":"S / V"}${/w$/i.test(u)?" (tomando la potencia como VA; con cos φ distinto de 1 usá S = P / cos φ)":""}.`,
      `I(B) = ${fmt(s,0)} / ${tri?`(${V} × 1,73)`:V} = ${fmt(I)} A`,
      `Después elegí el ITM/PIA y el cable verificando I(B) ≤ I(N) ≤ I(Z).`]};
  }
  const B = /(\d+)\s*bocas/i.exec(q);
  if(B && /iug|iluminaci|luces|l[aá]mpar/.test(t)){
    const n = parseInt(B[1]), S = n*60*2/3;
    return {title:"Potencia de un circuito IUG", steps:[
      `Fórmula del curso: S = bocas × 60 VA × 2/3 (simultaneidad).`,
      `S = ${n} × 60 × 2/3 = ${fmt(S,1)} VA`, `I(B) = ${fmt(S,1)} / 220 = ${fmt(S/220)} A`]};
  }
  return null;
}

function compareParts(q){
  const m = /(?:diferenc\w*|compar\w*|versus|vs\.?)\s+(?:entre\s+|de\s+)?(.+?)\s+(?:y|e|vs\.?|versus|con|contra)\s+(?:el\s+|la\s+|los\s+|las\s+)?(.+?)\s*[?.!]*$/i.exec(q);
  return m ? [m[1].replace(/^(el|la|los|las)\s+/i,""), m[2]] : null;
}
function asistAnswer(q){
  const t = q.trim();
  if(/^(hola|buenas|buen dia|buenos dias|buenas tardes|hey)\W*$/i.test(t)) return {html:`<p>¡Hola! Preguntame lo que necesites del curso: fórmulas, valores, normas, pasos del proyecto o comparaciones (por ejemplo «diferencia entre ITM e ID»). También calculo corriente y caída de tensión si me das los datos.</p>`};
  if(/^(gracias|muchas gracias|genial|perfecto|ok|dale)\W*$/i.test(t)) return {html:`<p>¡De nada! Si querés seguir, preguntame otro tema o abrí el módulo para repasar.</p>`};
  let html = "", used = [];
  const calc = tryCalc(t);
  if(calc) html += `<div class="calc"><h4>🧮 ${esc(calc.title)}</h4><ol class="steps">${calc.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`;

  const cmp = compareParts(t);
  if(cmp){
    const ok = d => d.type==="item"||d.type==="paso"||d.type==="norma"||d.type==="cat";
    const clean = x => itemsOf(x.d)[0].replace(/\s*\(p\. [^)]*\)/g,"").replace(/^(FÓRMULA|VALOR|REGLA|NORMA|CUENTA):\s*/,"").slice(0,210);
    const A = search(cmp[0], ok).res.filter(x=>x.hit>=1 && !/^OJO/.test(x.d.text||"")).slice(0,25), B = search(cmp[1], ok).res.filter(x=>x.hit>=1 && !/^OJO/.test(x.d.text||"")).slice(0,25);
    const ta = new Set(toks(cmp[0])), tb = new Set(toks(cmp[1]));
    const has = (d,set) => { const tk = new Set(d.tk); let n=0; set.forEach(w=>{ if(tk.has(w)) n++; }); return n===set.size; };
    const seenT = new Set();
    const excl = (R, mine, other) => R.filter(x => has(x.d,mine) && !has(x.d,other)).map(x=>({x,t:clean(x)})).filter(o => { const k=o.t.slice(0,60); if(seenT.has(k)) return false; seenT.add(k); return true; }).slice(0,4);
    const both = KB.docs.filter(d=>d.type==="tabla" && has(d,ta) && has(d,tb)).sort((x,y)=>{ const tt = d => { const k = new Set(toks(d.t.t)); let n=0; [...ta,...tb].forEach(w=>{ if(k.has(w)) n++; }); return n; }; return (tt(y)-tt(x)) || (x.tk.length-y.tk.length); })[0];
    if(both){ html += `<p>El curso tiene una tabla que compara justo esto:</p>` + tableHTML(both.t); used.push({d:both}); }
    const a = both ? [] : excl(A,ta,tb), bb = both ? [] : excl(B,tb,ta);
    const joint = A.concat(B).filter(x => has(x.d,ta) && has(x.d,tb)).map(x=>({x,t:clean(x)})).filter((o,i,arr)=>arr.findIndex(y=>y.t.slice(0,60)===o.t.slice(0,60))===i).slice(0,3);
    if(a.length || bb.length){
      const n = Math.max(a.length, bb.length), rows = [];
      for(let i=0;i<n;i++) rows.push([a[i]?a[i].t:"—", bb[i]?bb[i].t:"—"]);
      html += `<p>Esto dice el curso de cada uno:</p>` + tableHTML({t:`${cmp[0]}  vs  ${cmp[1]}`, cols:[cmp[0], cmp[1]], rows});
      if(joint.length) html += `<p><b>Cómo se relacionan:</b></p><ul class="rs-l">${joint.map(o=>`<li>${esc(o.t)}</li>`).join("")}</ul>`;
      used = used.concat(a.map(o=>o.x), bb.map(o=>o.x), joint.map(o=>o.x));
    }
  }

  const nt = norm(t);
  if(!calc && !cmp && /(paso a paso|pasos|como se arma|como se hace|armar)/.test(nt) && /proyecto/.test(nt)){
    const k = /trif/.test(nt) ? "tri" : (/segundo|2/.test(nt) ? "mono2" : "mono1"), P = PD[k];
    if(P){
      const lab = k==="tri" ? "Proyecto trifásico (380 V)" : k==="mono2" ? "Segundo proyecto (monofásico, GE Medio)" : "Primer proyecto (monofásico, GE Mínimo)";
      html += `<p><b>${lab}: los pasos en orden</b></p><ol class="steps">${P.pasos.map(x=>`<li><b>${esc(String(x.t).replace(/^Paso\s*\d+\s*[:.-]\s*/i,""))}.</b> ${esc((x.resultado||x.que).slice(0,170))}</li>`).join("")}</ol>
      <div class="refs"><button class="rc" onclick="PTAB='${k==="tri"?"tri":"mono"}';PSUB='${k==="mono2"?"mono2":"mono1"}';screenProyecto()">📋 Abrir ${lab.split(" (")[0]} con todo el detalle</button>${k!=="tri"?`<button class="rc" onclick="PTAB='tri';screenProyecto()">⚡ Ver la variante trifásica</button>`:""}${k==="mono1"?`<button class="rc" onclick="PTAB='mono';PSUB='mono2';screenProyecto()">📋 Segundo proyecto</button>`:""}</div>`;
      return {html, follow:["Variables del proyecto eléctrico","Cálculo del circuito seccional","Grado de electrificación"]};
    }
  }
  if(!calc && !cmp && /\bnormas?\b|\breglamentaci/.test(nt) && /(conocer|cuales|que normas|resumen|principales|existen|aplican|rigen|hay)/.test(nt)){
    const nd = KB.docs.find(d=>d.type==="tabla" && d.src==="normas");
    if(nd){ return {html:`<p>Estas son las normas y reglamentaciones que el curso marca como base para un instalador Categoría III:</p>`+tableHTML(nd.t)+`<div class="refs"><button class="rc" onclick="NQ='';screenNormas()">⚖️ Abrir Normas con el detalle</button></div>`, follow:["Qué puede hacer un Categoría III","Qué es la IRAM 2010","Normas de puesta a tierra"]}; }
  }
  const {res, nbase} = search(t);
  const top = res[0];
  const enough = top && top.hit >= Math.max(1, Math.ceil(nbase*.5));
  if(!enough && !calc && !html) return {html:`<p>No encontré eso en tus resúmenes, módulos de proyecto ni normas, y prefiero no inventar una respuesta.</p><p>Probá con otras palabras (por ejemplo el nombre del tema: «caída de tensión», «TPU», «Sla», «jabalina») o abrí directamente los módulos:</p><div class="refs"><button class="rc" onclick="goMods()">📚 Ver módulos</button><button class="rc" onclick="goNormas()">⚖️ Normas</button><button class="rc" onclick="goProj()">📋 Proyecto</button></div>`};
  if(enough){
    const nn = norm(t), askNo = /\bno (puede|pueden|esta|estan|debe)|prohibid|no permitid/.test(nn), askYes = !askNo && /\b(puede|pueden|permitid|habilitad|autorizad)/.test(nn);
    const best = top.sc, good = res.filter(x => x.sc >= best*.35 && x.hit >= Math.max(1,Math.ceil(nbase*.5)) && !(x.d.type==="cat" && ((askYes && /NO puede/.test(x.d.sec)) || (askNo && !/NO puede/.test(x.d.sec)))));
    const wantSteps = /paso|proyecto|como se arma|como se hace|armar/.test(norm(t));
    const items = [], seen = new Set();
    let pasos = good.filter(x=>x.d.type==="paso");
    if(wantSteps && pasos.length){
      const proj = pasos[0].d.proj; pasos = pasos.filter(x=>x.d.proj===proj).sort((a,b)=>a.d.n-b.d.n).slice(0,6);
      html += `<p><b>${esc(pasos[0].d.plabel)}: pasos relacionados</b></p><ol class="steps">${pasos.map(x=>`<li><b>Paso ${esc(x.d.n)}: ${esc(String(x.d.s.t).replace(/^Paso\s*\d+\s*[:.-]\s*/i,""))}.</b> ${esc(x.d.s.que)}${(x.d.s.calculo||[]).slice(0,2).map(c=>`<br><span class="mono">${esc(c)}</span>`).join("")}</li>`).join("")}</ol>`;
      used = used.concat(pasos);
    }
    if(!calc) good.filter(x=>x.d.type==="item"||x.d.type==="cat"||x.d.type==="norma"||(x.d.type==="paso"&&!wantSteps)).forEach(x => {
      if(items.length>=6) return;
      itemsOf(x.d).slice(0,2).forEach(s => { const k = s.slice(0,50); if(!seen.has(k) && !/^OJO/.test(s) && items.length<6){ seen.add(k); items.push({s, d:x.d}); } });
    });
    if(items.length){
      const mods = [...new Set(items.filter(i=>i.d.mod).map(i=>MODN(i.d.mod).n))];
      html += `<p>${calc?"Qué dice el curso sobre esto:":"Según tus resúmenes"}${mods.length&&!calc?` (${mods.slice(0,3).map(m=>"módulo "+m).join(", ")})`:""}:</p>
      <ul class="rs-l">${items.map(i=>liHTML(i.s, i.d.mod?`<small class="src">Mód. ${MODN(i.d.mod).n}</small>`:"")).join("")}</ul>`;
      used = used.concat(items.map(i=>({d:i.d})));
    }
    const forms = good.filter(x=>x.d.type==="form").slice(0, calc ? 1 : 2);
    if(forms.length){
      html += `<div class="sec" style="margin-top:12px">Fórmulas</div>` + forms.map(x=>{const f = x.d.f; return `<div class="fm"><h4>${esc(f.n)}</h4><div class="eq">${esc(f.f)}</div><p>${esc(f.u)}</p><p class="ex"><b>Ejemplo:</b> ${esc(f.e)}</p></div>`;}).join("");
      used = used.concat(forms);
    }
    const tab = res.find(x=>x.d.type==="tabla" && x.hit>=Math.max(1,Math.ceil(nbase*.5)) && (x.sc >= best*.45 || /tabla|cuadro|valores|cuanto|tabla/.test(norm(t))));
    if(tab && !cmp){ html += tableHTML(tab.d.t); used.push(tab); }
    const ojos = KB.docs.filter(d=>d.type==="item" && /^OJO/.test(d.text)).map(d=>({d, ...(()=>{const w=toks(t); const tk=new Set(d.tk); return {n:w.filter(x=>tk.has(x)).length}})()})).filter(x=>x.n>=Math.max(2,Math.ceil(nbase*.6))).sort((a,b)=>b.n-a.n).slice(0,2);
    if(ojos.length) html += `<div class="sec" style="margin-top:12px">Ojo con esto</div><ul class="rs-l">${ojos.map(o=>liHTML(o.d.text,`<small class="src">Mód. ${MODN(o.d.mod).n}</small>`)).join("")}</ul>`;
  }
  /* fuentes y seguimiento */
  const chips = [], seenC = new Set();
  used.forEach(u => { const d = u.d; if(!d) return; const key = d.type==="tabla"?"t"+(d.src||d.proj||d.mod)+d.t.t:d.type==="paso"?d.proj+d.n:d.type==="norma"?d.it.n:d.type==="cat"?"cat":d.mod; if(seenC.has(key)||chips.length>=4) return; seenC.add(key); chips.push(srcChip(d)); });
  if(chips.length) html += `<div class="refs"><small class="src" style="display:block;margin-bottom:4px">Para estudiarlo en detalle:</small>${chips.join("")}</div>`;
  const rel = []; const seenS = new Set();
  res.slice(0,30).forEach(x => { if(x.d.type==="item" && x.d.sec && !seenS.has(x.d.sec) && rel.length<3 && !/memorizar|^[0-9 ]+$/.test(x.d.sec)){ seenS.add(x.d.sec); rel.push(x.d.sec); } });
  return {html, follow: rel};
}

  return n>=2 && /calcul|regla de tres|se suman|cuánto (da|vale|resulta|consume|sale)/i.test(t);

const CALC = {expr:"", res:"", ans:null};

  const keys = [["C","k-c"],["⌫","k-c"],["%","k-o"],["÷","k-o"],["7"],["8"],["9"],["×","k-o"],["4"],["5"],["6"],["−","k-o"],["1"],["2"],["3"],["+","k-o"],["ANS","k-c"],["0"],[",",""],["=","k-eq"]];
  const b = document.createElement("div"); b.id = "calcBox";
  b.innerHTML = `<div class="ch"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2"/><path d="M13.4 4.6 7.9 13h3.8l-1.3 6.4 5.6-8.6h-3.8z"/></svg><b>Calcu<i>lectro</i></b><span class="grip"></span><button class="cx" aria-label="Cerrar">✕</button></div>

function calcClose(){

const calcOps = "+−×÷";
function calcPress(k){
  let e = CALC.expr;
  if(k==="C"){ CALC.expr=""; CALC.res=""; return calcShow(); }
  if(k==="⌫"){ CALC.expr = e.slice(0,-1); CALC.res=""; return calcShow(); }
  if(k==="="){
    const r = calcEval(e);
    if(r===null){ calcShake(); return; }
    CALC.res = calcFmt(r); CALC.ans = r; CALC.done = true; calcShow(true); return;
  }
  if(CALC.done){ CALC.done = false; if(!calcOps.includes(k) && k!=="%") e = ""; else e = String(CALC.ans).replace(".",","); CALC.res = ""; }
  if(k==="ANS"){ if(CALC.ans===null) return; k = String(+CALC.ans.toFixed(10)).replace(".",","); }
  if(calcOps.includes(k)){
    if(!e && k!=="−") return;
    if(calcOps.includes(e.slice(-1))) e = e.slice(0,-1);
  }
  if(k===","){ const last = e.split(/[+−×÷]/).pop(); if(last.includes(",")) return; if(!last) k = "0,"; }
  if(k==="%" && (!e || calcOps.includes(e.slice(-1)) || e.slice(-1)==="%")) return;
  CALC.expr = e + k; CALC.res = ""; calcShow();
}
function calcEval(e){
  if(!e) return null;
  const t = e.match(/\d+(?:,\d*)?%?|[+−×÷]/g); if(!t || t.join("")!==e) return null;
  const vals = [], ops = [];
  const prec = o => (o==="×"||o==="÷") ? 2 : 1;
  const apply = () => { const o = ops.pop(), b = vals.pop(), a = vals.pop(); if(a===undefined||b===undefined) throw 0;
    vals.push(o==="+"?a+b : o==="−"?a-b : o==="×"?a*b : a/b); };
  try {
    let expectNum = true, neg = false;
    for(const x of t){
      if(expectNum){
        if(x==="−"){ neg = !neg; continue; }
        if(calcOps.includes(x)) return null;
        let v = parseFloat(x.replace(",",".").replace("%","")); if(x.endsWith("%")) v /= 100;
        vals.push(neg ? -v : v); neg = false; expectNum = false;
      } else {
        while(ops.length && prec(ops[ops.length-1]) >= prec(x)) apply();
        ops.push(x); expectNum = true;
      }
    }
    if(expectNum) return null;
    while(ops.length) apply();
  } catch(_){ return null; }
  const r = vals[0]; return isFinite(r) ? r : null;
}
function calcFmt(r){
  const v = Math.round(r*1e6)/1e6;
  const [i, d] = String(Math.abs(v)).split(".");
  return (v<0?"−":"") + i.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (d ? ","+d : "");
}
function calcShow(eq){

  if(eq){ E.textContent = CALC.expr + " ="; Rr.textContent = CALC.res; const box = document.getElementById("calcBox"); box.classList.remove("zap"); void box.offsetWidth; box.classList.add("zap"); }
  else { E.textContent = CALC.res ? "" : (CALC.ans!==null && !CALC.expr ? "ANS = "+calcFmt(CALC.ans) : ""); Rr.textContent = CALC.expr || "0"; }
  Rr.classList.toggle("sm", Rr.textContent.length > 12);
}

function triFor(q){
  const t = String(q.q), right = ((q.opts||[]).find(o=>o.ok)||{t:""}).t;
  if(/(cos\s*(φ|phi|fi)|coseno de phi|coseno)[^.?]{0,20}\d/i.test(t)) return null;
  const m = right.match(/^[^\d]{0,20}?[\d.,]+\s*(kVA|VA|kW|W|mA|A|V|Ω|ohm)(?![a-zA-Z])/i);
  const tgt = m ? ({kva:"S", va:"S", kw:"P", w:"P", ma:"I", a:"I", v:"V", "ω":"R", ohm:"R"})[m[1].toLowerCase()] : null;
  if(!tgt) return null;
  const has = {V:/\d\s*V(?![A-Za-z])/.test(t), I:/\d\s*m?A(?![A-Za-z])/.test(t), R:/\d\s*(Ω|ohm)/i.test(t), P:/\d\s*k?W(?![A-Za-z])/.test(t), S:/\d\s*k?VA(?![A-Za-z])/.test(t)};
  const two = keys => keys.filter(k=>k!==tgt && has[k]).length >= 2;
  if(["V","I","R"].includes(tgt) && two(["V","I","R"]) && (has.R || tgt==="R")) return {k:"ohm", t:tgt};
  const tri = /trifás|1,73|√3|380\s*V/i.test(t);
  if(["S","V","I"].includes(tgt) && two(["S","V","I"])) return {k: tri?"s3":"s1", t:tgt};
  if(["P","V","I"].includes(tgt) && two(["P","V","I"])) return {k: tri?"s3":"p", t: tri&&tgt==="P"?"S":tgt};
  return null;
}

/* ---------- AYUDA oculta en cada pregunta (material del curso + triángulo + descartar) ---------- */
function helpDocs(q){
  try{
    const right = ((q.opts||[]).find(o=>o.ok)||{t:""}).t;
    const qn = norm(q.q), rn = norm(right);
    const ansNums = (right.match(/\d+(?:[.,]\d+)?/g)||[]).filter(n=>!qn.includes(norm(n)) && n.length>1);
    const qT = new Set(toks(q.q)), wT = new Set((q.opts||[]).filter(o=>!o.ok).flatMap(o=>toks(o.t)));
    const aT = [...new Set(toks(right))].filter(w => !qT.has(w) && !wT.has(w) && !/^\d+$/.test(w));
    const leak = d => { const t = norm(d.text), dT = new Set(d.tk);
      if(rn.length>6 && t.includes(rn)) return true;
      if(aT.length && aT.filter(w=>dT.has(w)).length/aT.length >= .5) return true;
      return ansNums.some(n => new RegExp("(^|[^0-9])"+norm(n).replace(/ /g," ")+"([^0-9]|$)").test(t)); };
    const {res} = search(q.q, d => d.type==="item" || d.type==="form");
    const sc = r => r.sc * (String(q.lv)===r.d.mod ? 1.6 : 1) * (r.d.type==="form" ? 1.15 : 1);
    const top = res.slice(0,40).filter(r => r.hit>=2 && !leak(r.d)).sort((a,b)=>sc(b)-sc(a));
    if(!top.length || sc(top[0]) < 5) return [];
    const out = [], seen = new Set();
    for(const r of top){ if(out.length>=2) break; const k = norm(r.d.text).slice(0,60); if(seen.has(k)) continue; seen.add(k); if(sc(r) < sc(top[0])*.55) break; out.push(r.d); }
    return out;
  }catch(e){ return []; }
}

}

      <button class="hcut" ${q.cutIdx?"disabled":""} onclick="cutTwo()">${q.cutIdx?"✂️ Ya descartaste 2 opciones":"✂️ Descartar 2 opciones incorrectas"}<small>${q.cutIdx?"Esta pregunta vale la mitad de puntos":"Si acertás, sumás la mitad de puntos"}</small></button>
    </div></details>`;
}

function uniGuideHTML(){
  let h = `<div class="theory"><b>¿Qué es un unifilar?</b> Es el esquema donde cada circuito se dibuja con <b>una sola línea</b> que representa todos sus conductores. El <b>topográfico</b>, en cambio, es un dibujo en vista real de los elementos. El unifilar se pega en la cara trasera de la tapa del TPU y es parte del proyecto que firma el instalador.<br><br>
  Recorrido: <b>RDD → DPLA → LAD → medidor → LP → TPA → CS → TPU (ID + PIA) → PAT</b>. Tocá cada bloque para ver la explicación.</div>`;
  UGUIDE.forEach(n=>{
    if(n.g){ h += `<div class="grp">${n.g}</div>`; return; }
    h += `<div class="un" onclick="this.classList.toggle('open')"><div class="rail">${usym(n.k)}</div>
      <div class="bx"><h4>${n.t}</h4><div class="sp">${n.s}</div><div class="hint">Tocá para leer</div>
      <div class="ud">${n.d}${n.pias?`<div class="pias">
        <div><b>IUG 1–3</b>PIA B 2×10 A<br>3000 A</div><div><b>IUG</b>curva B<br>iluminación</div><div><b>TUG 1–3</b>PIA C 2×16 A<br>4500 A</div></div>`:""}</div></div></div>`;
  });
  h += `<p class="note2">Basado en el material del curso. Antes de ejecutar una instalación real, confirmá los valores con la reglamentación vigente (AEA 90364, resoluciones del ERSeP y requisitos de EPEC o tu cooperativa).</p>`;
  return h;
}

function uniChallengesHTML(p){
  return `<div class="theory">Armá el unifilar de cada instalación eligiendo los componentes correctos. Después de verificar, cada pieza te muestra por qué es la correcta. Se aprueba con ${PASS}% y suma puntos al ranking.</div>` +
  UCH.map(c=>{
    const lv = p.levels[c.id];
    return `<button class="lv" onclick="startChallenge('${c.id}')"><div class="ico">${c.icon}</div>
      <div class="t"><h3>Reto ${c.id.slice(1)} · ${c.name}</h3><p>${lv?`Mejor: ${lv.pct}% · ${lv.score} pts`:(c.kind==="build"?c.slots.length+" componentes para armar":c.items.length+" ítems para revisar")}</p></div>
      <div class="stars">${starsHTML(lv?lv.stars:0)}</div></button>`;
  }).join("");
}

function startChallenge(id){
  const c = UCH.find(x=>x.id===id);
  UG = {c, checked:false};
  if(c.kind==="build"){ UG.opts = c.slots.map(s=>shuffle(s.o.map((t,i)=>({t, ok:i===0})))); UG.sel = c.slots.map(()=>-1); }
  else { UG.sel = c.items.map(()=>false); }
  setNav(null);
  app.innerHTML = `
  <div class="top"><div class="brand">${c.icon} ${c.name}</div></div>
  <div class="theory">${c.intro}</div>
  <button class="btn" onclick="renderChallenge()">Empezar</button>
  <button class="btn ghost" onclick="UG=null;screenUni()">Volver</button>`;
  window.scrollTo(0,0);
}

function renderChallenge(){
  const c = UG.c;
  const done = c.kind==="build" ? UG.sel.filter(x=>x>=0).length : null;
  let body = "";
  if(c.kind==="build"){
    body = c.slots.map((s,i)=>{
      const j = UG.sel[i], o = j>=0 ? UG.opts[i][j] : null;
      const cls = UG.checked ? (o && o.ok ? "ok" : "bad") : "";
      return `<div class="un" ${UG.checked?"":`onclick="openSlot(${i})"`}><div class="rail">${usym(s.k)}</div>
        <div class="bx ${cls}"><div class="lab">${i+1}. ${s.l}</div>
        <div class="pick ${o?"":"empty"}">${o?esc(o.t):"Tocá para elegir"}</div>
        ${UG.checked?`<div class="why">${o&&o.ok?"✅ ":"❌ "}${o&&o.ok?"":`<b>Correcto:</b> ${esc(s.o[0])}<br>`}${esc(s.w)}</div>`:""}</div></div>`;
    }).join("");
  } else {
    body = c.items.map((it,i)=>{
      let cls = UG.sel[i] ? "sel" : "";
      if(UG.checked){ const right = UG.sel[i]===it.bad; cls = right ? "ok" : "bad"; }
      return `<button class="spot ${cls}" ${UG.checked?"":`onclick="toggleSpot(${i})"`}><span class="tick">${UG.checked?(UG.sel[i]===it.bad?"✓":"✕"):(UG.sel[i]?"!":"")}</span>
        <span>${esc(it.t)}${UG.checked?`<small>${it.bad?"Estaba MAL. ":"Estaba bien. "}${esc(it.w)}</small>`:""}</span></button>`;
    }).join("");
  }
  app.innerHTML = `
  <div class="qhead"><span>${c.icon} Reto ${c.id.slice(1)} · ${c.name}</span><span>${c.kind==="build"?done+"/"+c.slots.length:""}</span></div>
  <div class="bar"><div style="width:${c.kind==="build"?done/c.slots.length*100:0}%"></div></div>
  ${c.kind==="spot"?`<p class="note2" style="margin:0 0 12px">Tocá los ítems que consideres incorrectos.</p>`:""}
  <div id="chbody">${body}</div>
  <div id="chres"></div>
  ${UG.checked?"":`<button class="btn" onclick="verifyChallenge()">Verificar</button>`}
  <button class="link" onclick="UG=null;screenUni()">Salir</button>`;
  if(UG.checked) showResult();
}

function openSlot(i){
  const s = UG.c.slots[i];
  const sh = document.createElement("div");
  sh.className = "sheet"; sh.id = "sheet";
  sh.onclick = e => { if(e.target===sh) sh.remove(); };
  sh.innerHTML = `<div><h3>${i+1}. ${s.l}</h3>${UG.opts[i].map((o,j)=>`<button class="opt" onclick="pickOpt(${i},${j})">${esc(o.t)}</button>`).join("")}</div>`;
  document.body.appendChild(sh);
}
function pickOpt(i,j){
  UG.sel[i] = j;
  const sh = $("#sheet"); if(sh) sh.remove();
  const y = window.scrollY; renderChallenge(); window.scrollTo(0,y);
}
function toggleSpot(i){
  UG.sel[i] = !UG.sel[i];
  const y = window.scrollY; renderChallenge(); window.scrollTo(0,y);
}

function verifyChallenge(){
  const c = UG.c;
  if(c.kind==="build" && UG.sel.some(x=>x<0)){ alert("Completá todos los componentes antes de verificar."); return; }
  UG.checked = true;
  const y = window.scrollY; renderChallenge(); window.scrollTo(0,y);
  $("#chres").scrollIntoView({behavior:"smooth", block:"center"});
}

function showResult(){
  const c = UG.c, p = me();
  const total_ = c.kind==="build" ? c.slots.length : c.items.length;
  const right = c.kind==="build" ? UG.sel.filter((j,i)=>UG.opts[i][j].ok).length
                                 : UG.sel.filter((v,i)=>v===c.items[i].bad).length;
  const pct = Math.round(right/total_*100);
  const stars = pct===100 ? 3 : pct>=85 ? 2 : pct>=PASS ? 1 : 0;
  const score = right*10 + (right===total_ ? 20 : 0);
  const prev = p.levels[c.id];
  if(!UG.saved){
    p.levels[c.id] = {score:Math.max(score, prev?prev.score:0), pct:Math.max(pct, prev?prev.pct:0), stars:Math.max(stars, prev?prev.stars:0)};
    UG.got = awardBadges(p); UG.saved = true; save();
  }
  const pass = pct>=PASS, idx = UCH.findIndex(x=>x.id===c.id), nxt = UCH[idx+1];
  $("#chres").innerHTML = `
  <div class="fb ${pass?"ok":"bad"}" style="text-align:center">
    <h4>${pass?"🎉 ¡Aprobado!":"💪 Casi"} · ${right} de ${total_} (${pct}%)</h4>
    <div class="stars" style="font-size:26px">${starsHTML(stars)}</div>
    <p style="margin-top:6px">+${score} pts${pass?"":` · necesitás ${PASS}% para aprobar`}</p>
    ${UG.got&&UG.got.length?`<div class="newb">${UG.got.map(b=>`<div class="badge">${b.e} <b>${b.n}</b></div>`).join("")}</div>`:""}
  </div>
  <button class="btn" onclick="startChallenge('${c.id}')">Reintentar</button>
  ${nxt?`<button class="btn ghost" onclick="startChallenge('${nxt.id}')">Siguiente reto</button>`:""}
  <button class="btn ghost" onclick="UG=null;UTAB='retos';screenUni()">Volver a los retos</button>`;
}

</script>
<script>
/* ---------- BOTÓN ATRÁS: lo maneja la app principal (cada pantalla nueva suma un paso) ---------- */
(function(){
  const NAMES = ["screenHome","screenMods","screenLevels","screenModule","screenNormas","screenAsistente","screenRank","screenBadges"];
  const NAV = []; let busy = false;
  const same = (a,b) => a.n===b.n && JSON.stringify(a.a)===JSON.stringify(b.a);
  function record(n, a){
    if(busy) return;
    const e = {n, a}, last = NAV[NAV.length-1];
    if(last && (last.n===n || same(last,e))){ NAV[NAV.length-1]=e; return; }
    NAV.push(e);
    if(NAV.length>1){ try{ parent.__quizPush && parent.__quizPush(); }catch(_){} }
  }
  NAMES.forEach(n=>{
    const f = window[n]; if(typeof f!=="function") return;
    window[n] = function(){ const a=[].slice.call(arguments); const r=f.apply(this,a); record(n,a.map(x=>typeof x==="object"?undefined:x)); return r; };
  });
  if(document.querySelector("#app .hello")) NAV.push({n:"screenHome",a:[]});
  window.__quizBack = function(){
    if(S && (S.mode==="lv"||S.mode==="mod")){ rSave(); S=null; }
    if(NAV.length<2) return false;
    NAV.pop(); const e = NAV[NAV.length-1]; busy = true;
    try{ window[e.n].apply(null, e.a); }catch(_){}
    busy = false; window.scrollTo(0,0); return true;
  };
  window.__navReset = function(){ NAV.length=0; };
  ["screenLogin","screenLoginSrv"].forEach(n=>{ const f=window[n]; if(typeof f==="function") window[n]=function(){ window.__navReset(); return f.apply(this,arguments); }; });
})();
</script>
